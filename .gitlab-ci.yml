# CI（GitLab）—— 四阶段，对应门禁（.plan/README.md §2 与 .plan/CARBON.md）
#
# 双平台：本文件与 .github/workflows/ci.yml 等价，两者都只调 scripts/ci.sh。
# 要加减门禁，改 scripts/ci.sh；不要在这里直接写命令。
#
#   lint  门禁 3（部分）与 5、8、10–12：stylua · P0 棘轮 · 认证范围守卫 · 依赖方向 · LOC 记分板
#   types 门禁 3：luau-lsp analyze（需 Roblox 类型定义，已 vendor 进仓库）
#   build 门禁 1：rojo build
#   test  门禁 2：headless 测试（Lune + 拓扑序 loader，无需 Roblox）
#
# 工具链由仓库根的 rokit.toml 固定：rojo 7.7.1 · lune 0.11.1 · stylua 2.6.0 · luau-lsp 1.70.1
#
# 已知的网络风险：rokit 的安装脚本与工具下载走 GitHub。若 runner 处于受限网络，
# 把代理变量配成 CI/CD Variables（HTTPS_PROXY / HTTP_PROXY），或让 runner 预热
# ~/.rokit 缓存（下面的 cache 已按 rokit.toml 的哈希做键，正常命中时无需下载）。

stages:
  - lint
  - types
  - build
  - test

default:
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl unzip git ca-certificates
    - curl -fsSL https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
    - export PATH="$HOME/.rokit/bin:$PATH"
    - rokit install --no-trust-check
  cache:
    key:
      files:
        - rokit.toml
    paths:
      - .rokit/
    policy: pull-push

# 每个 job 只调 scripts/ci.sh：命令清单只有那一处，GitHub Actions 用的是同一份。
lint:
  stage: lint
  script:
    - bash scripts/ci.sh lint

types:
  stage: types
  script:
    - bash scripts/ci.sh types

build:
  stage: build
  script:
    - bash scripts/ci.sh build
  artifacts:
    paths:
      - place.rbxlx
    expire_in: 1 week

test:
  stage: test
  script:
    - bash scripts/ci.sh test

# 认证线**单独一个 job**：两条线的报告不得合并（CERT.md §9.2 / STEPS §二点五 规则 2）。
cert:
  stage: test
  script:
    - bash scripts/ci.sh cert
  artifacts:
    paths:
      - docs/cert/TRACE.md
      - docs/cert/verify/
      - docs/cert/coverage/
    expire_in: 4 weeks

# 保留 GitLab 自带的 SAST（免费的额外信号，与上面的门禁不冲突）
include:
  - template: Security/SAST.gitlab-ci.yml
